<!doctype html>
<html lang="en" class="tracker">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>CoD Streaming Tools Tracker</title>
  <link rel="stylesheet" href="/local/style.css">
  <script defer src="/local/progress.js"></script>
  <script defer src="/local/tracker.js"></script>
</head>
<body>
  <p id="status" role="status"></p>
  <section id="overlay-settings" aria-labelledby="overlay-heading" hidden>
    <header class="overlay-gallery-heading">
      <h2 id="overlay-heading">OBS overlays</h2>
      <button id="copy-overlay-url">Copy OBS overlay URL</button>
    </header>
    <div class="overlay-options">
      <article>
        <iframe class="layout-preview" loading="lazy" tabindex="-1" title="Default overlay preview" src="/local/overlay?preview=default"></iframe>
        <div class="layout-controls">
          <button data-overlay="default" aria-pressed="true" aria-label="Apply Default">Apply</button>
        </div>
      </article>
      <article>
        <iframe class="layout-preview" loading="lazy" tabindex="-1" title="Jabber overlay preview" src="/local/overlay?preview=jabber"></iframe>
        <div class="layout-controls">
          <button data-overlay="jabber" aria-pressed="false" aria-label="Apply Jabber">Apply</button>
          <a class="twitch-link" href="https://www.twitch.tv/jabberonline" target="_blank" rel="noopener noreferrer" aria-label="Jabber on Twitch"><svg aria-hidden="true" viewBox="0 0 24 24" width="22" height="22" fill="currentColor"><path d="M11.57 4.72h1.67v5.01h-1.67zm4.59 0h1.67v5.01h-1.67zM6.15 0 1.98 4.17v15.02h5.01V24l4.8-4.81h3.75l6.48-6.48V0zm14.2 11.88-3.75 3.75h-3.76l-3.34 3.34v-3.34H6.15V1.67h14.2z"/></svg></a>
        </div>
      </article>
      <article>
        <iframe class="layout-preview" loading="lazy" tabindex="-1" title="11annah overlay preview" src="/local/overlay?preview=11annah"></iframe>
        <div class="layout-controls">
          <button data-overlay="11annah" aria-pressed="false" aria-label="Apply 11annah">Apply</button>
          <a class="twitch-link" href="https://www.twitch.tv/11annah" target="_blank" rel="noopener noreferrer" aria-label="11annah on Twitch"><svg aria-hidden="true" viewBox="0 0 24 24" width="22" height="22" fill="currentColor"><path d="M11.57 4.72h1.67v5.01h-1.67zm4.59 0h1.67v5.01h-1.67zM6.15 0 1.98 4.17v15.02h5.01V24l4.8-4.81h3.75l6.48-6.48V0zm14.2 11.88-3.75 3.75h-3.76l-3.34 3.34v-3.34H6.15V1.67h14.2z"/></svg></a>
        </div>
      </article>
      <article>
        <iframe class="layout-preview" loading="lazy" tabindex="-1" title="Afterglow overlay preview" src="/local/overlay?preview=afterglow"></iframe>
        <div class="layout-controls">
          <button data-overlay="afterglow" aria-pressed="false" aria-label="Apply Afterglow">Apply</button>
        </div>
      </article>
      <article>
        <iframe class="layout-preview" loading="lazy" tabindex="-1" title="Eclipse overlay preview" src="/local/overlay?preview=scoreboard"></iframe>
        <div class="layout-controls">
          <button data-overlay="scoreboard" aria-pressed="false" aria-label="Apply Eclipse">Apply</button>
        </div>
      </article>
      <article>
        <iframe class="layout-preview" loading="lazy" tabindex="-1" title="Ember overlay preview" src="/local/overlay?preview=filmstrip"></iframe>
        <div class="layout-controls">
          <button data-overlay="filmstrip" aria-pressed="false" aria-label="Apply Ember">Apply</button>
        </div>
      </article>
      <article>
        <iframe class="layout-preview" loading="lazy" tabindex="-1" title="Tide overlay preview" src="/local/overlay?preview=blueprint"></iframe>
        <div class="layout-controls">
          <button data-overlay="blueprint" aria-pressed="false" aria-label="Apply Tide">Apply</button>
        </div>
      </article>
      <article>
        <iframe class="layout-preview" loading="lazy" tabindex="-1" title="Velvet overlay preview" src="/local/overlay?preview=field-manual"></iframe>
        <div class="layout-controls">
          <button data-overlay="field-manual" aria-pressed="false" aria-label="Apply Velvet">Apply</button>
        </div>
      </article>
    </div>
  </section>
  <div id="tracker-content">
    <aside aria-label="Weapon roster">
      <label for="search">Find a weapon</label>
      <input id="search" type="search" autocomplete="off">
      <nav id="roster" aria-label="Weapons"></nav>
    </aside>
    <div class="tracker-panels">
      <section class="collection" aria-labelledby="collection-heading">
        <div class="collection-heading">
          <h2 id="collection-heading">Overall progress</h2>
          <p id="overall-count" class="subtitle"></p>
        </div>
        <progress id="overall-meter" aria-label="Overall camo completion" max="1" value="0"></progress>
        <div id="mastery-tiles" class="mastery-tiles"></div>
      </section>
      <section class="overview" aria-labelledby="overview-heading">
        <h2 id="overview-heading">Next camo unlocks</h2>
        <div id="overview-content"></div>
      </section>
      <main>
        <section id="detail" aria-label="Camo progress"></section>
      </main>
    </div>
  </div>
  <dialog id="overlay-dialog">
    <form method="dialog">
      <h2>OBS overlay</h2>
      <p>Use this URL in an OBS Browser Source. CoD Streaming Tools serves the overlay while it’s running.</p>
      <label for="overlay-url">Browser Source URL</label>
      <input id="overlay-url" readonly>
      <button>Close</button>
    </form>
  </dialog>
</body>
</html>
