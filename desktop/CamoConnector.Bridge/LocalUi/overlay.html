<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>CoD Streaming Tools Overlay</title>
  <link rel="stylesheet" href="/local/style.css">
  <script defer src="/local/progress.js"></script>
  <script defer src="/local/overlay.js"></script>
</head>
<body class="overlay">
  <section id="overlay-card" aria-live="polite" hidden>
    <div class="sweep-frame" aria-hidden="true">
      <span class="sweep-bloom"></span>
      <span class="sweep-flare"></span>
    </div>
    <svg class="wave-frame" aria-hidden="true">
      <defs>
        <linearGradient id="wave-face" x2=".8" y2="1" gradientUnits="objectBoundingBox">
          <stop stop-color="#10252a" stop-opacity=".93"/><stop offset=".48" stop-color="#0d151b" stop-opacity=".92"/><stop offset="1" stop-color="#090f15" stop-opacity=".91"/>
        </linearGradient>
        <linearGradient id="wave-rim">
          <stop stop-color="#39dcca"/><stop offset=".13" stop-color="#36958d"/>
          <stop offset=".22" stop-color="#6af5e7"/><stop offset=".38" stop-color="#418b85"/>
          <stop offset=".60" stop-color="#7ef8eb"/><stop offset=".77" stop-color="#69eadd"/>
          <stop offset="1" stop-color="#38867f" stop-opacity=".45"/>
        </linearGradient>
        <path id="wave-outline"/>
        <mask id="wave-cutout" x="-5%" y="-10%" width="110%" height="120%" maskUnits="userSpaceOnUse">
          <rect x="-5%" y="-10%" width="110%" height="120%" fill="white"/>
          <path id="wave-inner" fill="black"/>
        </mask>
      </defs>
      <use href="#wave-outline" fill="url(#wave-face)"/>
      <g class="wave-edge">
        <use href="#wave-outline" fill="url(#wave-rim)" mask="url(#wave-cutout)"/>
      </g>
    </svg>
    <div class="overlay-heading">
      <h1 id="weapon"></h1>
      <span id="jabber-class"></span>
      <span id="jabber-brand">JABBER&#8217;S ARMOURY</span>
      <span class="armoury-icons" aria-hidden="true">
        <svg viewBox="0 0 20 20"><path d="m10 1 8 4-8 4-8-4zm-8 6 7 4v8l-7-4zm9 4 7-4v8l-7 4z"/></svg><span id="armoury-count"></span>
        <svg viewBox="0 0 24 24"><path d="M3 18c3-3 3-5 3-8a6 6 0 0 1 5-6V2h2v2a6 6 0 0 1 5 6c0 3 0 5 3 8v1H3zm6 2h6a3 3 0 0 1-6 0"/></svg>
        <span class="armoury-gear">&#9881;</span>
      </span>
      <p id="weapon-level" hidden></p>
    </div>
    <div id="unlock-rows"></div>
  </section>
</body>
</html>
