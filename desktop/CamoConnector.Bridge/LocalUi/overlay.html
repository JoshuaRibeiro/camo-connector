<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>CoD Streaming Tools Overlay</title>
  <link rel="stylesheet" href="/local/style.css">
  <script defer src="/local/progress.js"></script>
  <script defer src="/local/overlay.js"></script>
</head>
<body class="overlay">
  <section id="overlay-card" aria-live="polite" hidden>
    <svg class="wave-frame" aria-hidden="true">
      <defs>
        <linearGradient id="wave-face" x2=".8" y2="1" gradientUnits="objectBoundingBox">
          <stop stop-color="#10272a" stop-opacity=".87"/><stop offset=".48" stop-color="#0d151a" stop-opacity=".88"/><stop offset="1" stop-color="#090f15" stop-opacity=".86"/>
        </linearGradient>
        <linearGradient id="wave-rim">
          <stop stop-color="#58e4cd"/><stop offset=".12" stop-color="#307e78"/><stop offset=".25" stop-color="#69ecdc"/><stop offset=".5" stop-color="#31625f"/><stop offset=".78" stop-color="#80fae6"/><stop offset="1" stop-color="#335656"/>
        </linearGradient>
        <path id="wave-outline"/>
      </defs>
      <use class="wave-halo" href="#wave-outline"/>
      <use class="wave-surface" href="#wave-outline"/>
      <path id="wave-spine"/>
    </svg>
    <div class="overlay-heading">
      <h1 id="weapon"></h1>
      <span id="jabber-class"></span>
      <span id="jabber-brand">JABBER&#8217;S ARMOURY</span>
      <span class="armoury-icons" aria-hidden="true">
        <svg viewBox="0 0 20 20"><path d="m10 1 8 4-8 4-8-4zm-8 6 7 4v8l-7-4zm9 4 7-4v8l-7 4z"/></svg><span id="armoury-count"></span>
        <svg viewBox="0 0 24 24"><path d="M3 18c3-3 3-5 3-8a6 6 0 0 1 5-6V2h2v2a6 6 0 0 1 5 6c0 3 0 5 3 8v1H3zm6 2h6a3 3 0 0 1-6 0"/></svg>
        <span class="armoury-gear">&#9881;</span>
      </span>
      <p id="weapon-level" hidden></p>
    </div>
    <div id="unlock-rows"></div>
  </section>
</body>
</html>
