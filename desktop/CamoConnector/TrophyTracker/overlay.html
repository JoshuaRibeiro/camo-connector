<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Trophy count</title>
<style>
  :root { --gold:#efd49b; --orange:#b88243; --pace:#b2e1df; --cup:1.4em; --pulse:520ms; }
  * { box-sizing:border-box }
  body { margin:0; background:transparent; overflow:hidden; font:500 clamp(8px,min(3.5vw,16vh),22px)/1.1 "Segoe UI Variable Display","Segoe UI",Arial,sans-serif; color:#faf9f6 }
  #card { position:relative; margin:.18em auto; width:min(96%,23em); padding:.55em 1em .7em; text-shadow:0 1px 2px #000,0 0 4px #000b }
  #card[hidden] { display:none }
  .score { font-variant-numeric:tabular-nums; display:flex; align-items:baseline; justify-content:center; gap:.45em; margin-bottom:.65em }
  #count { font-size:1.85em; font-weight:600; letter-spacing:-.035em; display:inline-block; transform-origin:center }
  .goal { color:#e4e1da; font-size:1.05em; font-weight:400 }
  #daily { display:block; color:#f1e9d9; font-size:.8em; letter-spacing:.025em; margin:.8em 0 0 }
  .rail { position:relative; margin:0; height:.32em; border-radius:1em; background:#37393bd9; box-shadow:0 1px 3px #000a }
  .rail::after { content:""; position:absolute; inset:0; background:repeating-linear-gradient(90deg,transparent 0 calc(10% - 1px),#17171788 calc(10% - 1px) 10%); border-radius:inherit }
  #fill { position:absolute; inset:0 auto 0 0; width:var(--progress,0%); border-radius:inherit; overflow:hidden; background:linear-gradient(90deg,var(--orange),var(--gold)); transition:width .45s ease-out }
  #fill::after { content:""; position:absolute; inset:0; background:linear-gradient(110deg,transparent 40%,#fff5,transparent 60%); animation:sweep 8s infinite }
  #pace { position:absolute; z-index:1; top:-.23em; bottom:-.23em; width:2px; background:var(--pace); box-shadow:0 0 3px #000; transition:left .45s }
  .cup { position:absolute; z-index:2; left:var(--progress,0%); top:50%; transform:translate(-50%,-50%); transition:left .45s ease-out; width:var(--cup); height:var(--cup); color:var(--gold); filter:drop-shadow(0 2px 2px #000b) }
  svg { width:100%; height:100%; animation:shimmer 6s infinite }
  .cup::after { content:""; width:.22em; height:.22em; border-radius:50%; background:var(--gold); position:absolute; right:-.3em; top:0; opacity:0; color:#fff1be }
  .gain #count { animation:bump var(--pulse) ease-out }
  .gain #fill { animation:flash var(--pulse) }
  .gain .cup::after { animation:spark var(--pulse) ease-out }
  @keyframes bump { 35% { transform:scale(1.035);color:var(--gold) } }
  @keyframes flash { 40% { box-shadow:0 0 .65em var(--gold);filter:brightness(1.25) } }
  @keyframes spark { 25% {opacity:1} to {transform:translate(.25em,-.65em) scale(.45);opacity:0} }
  @keyframes sweep { 0%,80% {transform:translateX(-110%)} 100% {transform:translateX(110%)} }
  @keyframes shimmer { 50% {filter:brightness(1.12)} }
  @media(prefers-reduced-motion:reduce) { *,*::after { animation:none!important;transition:none!important } }
</style>
<main id="card" hidden>
  <div class="score"><strong id="count"></strong><span class="goal">/ 10,000</span></div>
  <div class="rail" role="progressbar" aria-label="Trophies" aria-valuemin="0" aria-valuemax="10000">
    <div id="fill"></div><i id="pace" aria-hidden="true"></i>
    <span class="cup" aria-hidden="true"><svg viewBox="0 0 40 40" fill="none">
      <g stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round">
        <path d="M11 8H5v4a8 8 0 0 0 8 8m16-12h6v4a8 8 0 0 1-8 8"/>
        <path d="M11 6h18v9a9 9 0 0 1-18 0z" fill="#322b21"/>
        <path d="M20 24v8m-6 2h12"/>
      </g></svg></span>
  </div>
  <span id="daily"></span>
</main>
<script>
  const card = document.getElementById('card');
  const count = document.getElementById('count');
  const format = new Intl.NumberFormat('en-GB');
  let previous;  const overlayVersion = '__OVERLAY_VERSION__';
  async function checkVersion() {
    try {
      const response = await fetch('/api/version', { cache: 'no-store' });
      if (response.ok) {
        const { overlay } = await response.json();
        if (overlayVersion !== overlay) {
          location.replace('/overlay?v=' + encodeURIComponent(overlay));
          return;
        }
      }
    } catch {
      // Retry when the local server returns.
    }
    setTimeout(checkVersion, 2000);
  }
  async function update() {
    try {
      const response = await fetch('/api/state', { cache: 'no-store' });
      if (response.ok) {
        const { current, goal, pace, neededToday } = await response.json();
        count.textContent = format.format(current);
        document.getElementById('daily').textContent = neededToday <= 0 ? 'Daily Target Hit!' : format.format(neededToday) + ' needed today';
        card.style.setProperty('--progress', Math.min(100, current / goal * 100) + '%');
        document.getElementById('pace').style.left = Math.min(100, pace / goal * 100) + '%';
        document.querySelector('.rail').setAttribute('aria-valuenow', Math.min(goal, current));
        if (previous !== undefined && current > previous) {
          card.classList.remove('gain');
          void card.offsetWidth;
          card.classList.add('gain');
        }
        previous = current;
        card.hidden = false;
      }
    } catch { /* Hold the last confirmed reading during a reconnect. */ }    setTimeout(update, 200);
  }
  update();
  checkVersion();
</script>
</html>
