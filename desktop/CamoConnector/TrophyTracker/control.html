<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Trophy Tracker</title>
  <style>
    :root {
      color-scheme: dark;
      font-family: Bahnschrift, "Segoe UI", sans-serif;
      color: #d7e2e8;
      background: #111419;
      scrollbar-color: #527b80 #111419;
      --accent: #8dd7ce;
      --muted: #9eb3c1;
      --border: #324654;
    }
    * { box-sizing: border-box; }
    body, h1, h2, p { margin: 0; }
    main { padding: 1rem clamp(.85rem, 3vw, 2rem); display: grid; gap: .85rem; }
    h1 { font-size: 1.45rem; }
    h2 { font-size: 1rem; }
    section, form {
      background: #1a2027;
      border: 1px solid var(--border);
      border-radius: .65rem;
      padding: 1rem;
      min-width: 0;
    }
    .overview { background: linear-gradient(115deg, #1a3033, #171e26 75%); }
    .overview-header, .reading {
      display: flex; align-items: baseline; flex-wrap: wrap; justify-content: space-between; gap: .35rem .8rem;
    }
    .overview-header h2 { color: var(--accent); }
    .count { font-size: clamp(1.75rem, 6vw, 3rem); font-weight: 650; font-variant-numeric: tabular-nums; margin: .45rem 0; }
    .goal, #source, #status, #save-status { color: var(--muted); }
    #source, #status, #save-status { font-size: .875rem; }
    .goal { font-size: .6em; font-weight: 400; }
    progress {
      display: block; width: 100%; height: .35rem; appearance: none; border: 0; border-radius: 999px;
      background: #324654; overflow: hidden; accent-color: var(--accent);
    }
    progress::-webkit-progress-bar { background: #324654; }
    progress::-webkit-progress-value { background: var(--accent); border-radius: 999px; }
    .reading { margin-top: .65rem; }
    .controls { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1.4fr); gap: .85rem; }
    .row { display: flex; gap: .45rem; flex-wrap: wrap; margin-top: .55rem; }
    input, button {
      font: inherit; color: inherit; border-radius: .42rem; border: 1px solid #405156;
      background: #18282b; padding: .44rem .62rem;
    }
    input { min-width: 0; }
    #target { width: 7rem; max-width: 100%; }
    #url { flex: 1 1 13rem; font: .82rem ui-monospace, monospace; }
    button { cursor: pointer; border-radius: 999px; }
    button:hover { border-color: var(--accent); }
    button:focus-visible, input:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
    #save-status:not(:empty) { margin-top: .55rem; }
    @media (max-width: 650px) { .controls { grid-template-columns: minmax(0, 1fr); } }
  </style>
  <script src="/capture.js" defer></script>
</head>
<body>
  <main>
    <h1>Trophy Tracker</h1>
    <section class="overview" aria-labelledby="progress-heading">
      <div class="overview-header">
        <h2 id="progress-heading">Overall progress</h2>
        <p id="source">Starting total</p>
      </div>
      <p class="count"><span id="current">0</span> <span class="goal">/ <span id="goal">10000</span></span></p>
      <progress id="trophy-meter" aria-label="Progress towards trophy target" max="10000" value="0"></progress>
      <div class="reading">
        <p id="status" role="status">Waiting for the selected capture source</p>
      </div>
    </section>
    <div class="controls">
      <form id="settings" aria-labelledby="target-heading">
        <h2 id="target-heading"><label for="target">Trophy target</label></h2>
        <div class="row">
          <input id="target" type="number" required min="1" step="1" value="10000">
          <button>Save target</button>
        </div>
        <p id="save-status" role="status"></p>
      </form>
      <form id="correction">
        <h2><label for="correct-total">Correct trophy total</label></h2>
        <div class="row">
          <input id="correct-total" type="number" required min="0" max="99999" step="1">
          <button>Save total</button>
        </div>
        <p id="correction-status" role="status"></p>
      </form>
      <section aria-labelledby="overlay-heading">
        <h2 id="overlay-heading"><label for="url">OBS Browser Source URL</label></h2>
        <div class="row">
          <input id="url" readonly value="http://127.0.0.1:47851/overlay">
          <button id="copy">Copy URL</button>
        </div>
      </section>
    </div>
  </main>
</body>
</html>
