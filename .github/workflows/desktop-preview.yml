name: Portable desktop preview

on:
  pull_request:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - run: ./tests/portable-replacement.ps1
      - run: ./tests/detector-weapon.ps1
      - name: Prepare DirectShow capture runtime
        run: |
          # Archive URL and checksum from the Gyan.FFmpeg 8.1.2 WinGet manifest.
          $version = '8.1.2'
          $archiveName = "ffmpeg-$version-full_build"
          $url = "https://github.com/GyanD/codexffmpeg/releases/download/$version/$archiveName.zip"
          $sha256 = 'B8CDEFAB5F50590A076C27C2B56B0294A0E6154FADED28BA1BA05EBC4F801F57'
          $archive = Join-Path $env:RUNNER_TEMP "$archiveName.zip"
          curl.exe --fail --location --retry 3 --connect-timeout 15 --max-time 120 --output $archive $url
          if ($LASTEXITCODE) { throw 'Could not download the pinned Windows FFmpeg archive.' }
          if ((Get-FileHash -LiteralPath $archive -Algorithm SHA256).Hash -ne $sha256) {
            throw 'The FFmpeg archive did not match its pinned SHA-256.'
          }

          $extracted = Join-Path $env:RUNNER_TEMP 'camo-ffmpeg'
          Expand-Archive -LiteralPath $archive -DestinationPath $extracted
          $package = Join-Path $extracted $archiveName
          $capture = Join-Path $package 'bin'
          $ffmpeg = Join-Path $capture 'ffmpeg.exe'
          $devices = & $ffmpeg -hide_banner -devices
          if ($LASTEXITCODE -or !($devices -match '\bdshow\b')) {
            throw 'The pinned FFmpeg executable lacks DirectShow support.'
          }
          Get-ChildItem -LiteralPath $package -File |
            Where-Object Name -Match '^(LICENSE|COPYING|NOTICE)' |
            Copy-Item -Destination $capture
          "CAMO_CAPTURE_DIRECTORY=$capture" >> $env:GITHUB_ENV
      - name: Prepare OCR runtime
        run: |
          # Installer URL and checksum from the tesseract-ocr.tesseract 5.5.3 WinGet manifest.
          $url = 'https://github.com/tesseract-ocr/tesseract/releases/download/5.5.3/tesseract-ocr-w64-setup-5.5.3.20260724.exe'
          $sha256 = 'BEE9E3434BD94FD65387D9BE28CD467A41F61B1275383B55B0F59A1331270AE4'
          $installer = Join-Path $env:RUNNER_TEMP 'tesseract-setup.exe'
          curl.exe --fail --location --retry 3 --connect-timeout 15 --max-time 120 --output $installer $url
          if ($LASTEXITCODE) { throw 'Could not download the pinned Windows Tesseract installer.' }
          if ((Get-FileHash -LiteralPath $installer -Algorithm SHA256).Hash -ne $sha256) {
            throw 'The Tesseract installer did not match its pinned SHA-256.'
          }

          $ocr = Join-Path $env:RUNNER_TEMP 'camo-tesseract'
          # NSIS requires /D to be last, with the destination unquoted.
          $setup = Start-Process -FilePath $installer -ArgumentList "/S /D=$ocr" -WindowStyle Hidden -Wait -PassThru
          if ($setup.ExitCode -ne 0) { throw "Tesseract setup failed with exit code $($setup.ExitCode)." }
          $tesseract = Join-Path $ocr 'tesseract.exe'
          $models = Join-Path $ocr 'tessdata'
          if (!(Test-Path -LiteralPath $tesseract -PathType Leaf) -or
              !(Test-Path -LiteralPath (Join-Path $models 'eng.traineddata') -PathType Leaf)) {
            throw 'Could not find Tesseract and the English OCR model.'
          }
          $languages = & $tesseract --tessdata-dir $models --list-langs
          if ($LASTEXITCODE -or $languages -notcontains 'eng') {
            throw 'The pinned Tesseract executable cannot load the English model.'
          }
          "CAMO_OCR_DIRECTORY=$ocr" >> $env:GITHUB_ENV
      - run: ./scripts/build-detector-development.ps1 -CaptureDirectory $env:CAMO_CAPTURE_DIRECTORY -OcrDirectory $env:CAMO_OCR_DIRECTORY
        if: github.ref_type != 'tag'
      - name: Build desktop preview
        if: github.ref_type != 'tag'
        env:
          CAMO_UPDATE_PUBLIC_KEY: ${{ vars.CAMO_UPDATE_PUBLIC_KEY }}
        run: |
          $key = ''
          if ($env:CAMO_UPDATE_PUBLIC_KEY) {
            $key = Join-Path $env:RUNNER_TEMP 'camo-update-public.pem'
            [IO.File]::WriteAllText($key, $env:CAMO_UPDATE_PUBLIC_KEY)
          }
          ./scripts/build-desktop-preview.ps1 -CaptureDirectory $env:CAMO_CAPTURE_DIRECTORY -OcrDirectory $env:CAMO_OCR_DIRECTORY -UpdatePublicKeyFile $key -PreviewNumber $env:GITHUB_RUN_NUMBER
          'CAMO_CHECK_ROOT=dist/desktop-preview' >> $env:GITHUB_ENV
      - name: Package verified desktop release
        if: github.ref_type == 'tag'
        env:
          CAMO_UPDATE_PUBLIC_KEY: ${{ vars.CAMO_UPDATE_PUBLIC_KEY }}
          CAMO_UPDATE_NOTIFY_URL: ${{ vars.CAMO_UPDATE_NOTIFY_URL }}
          CAMO_PORTABLE_SIGNING_KEY: ${{ secrets.CAMO_PORTABLE_SIGNING_KEY }}
        run: |
          $version = (Get-Content desktop/version.txt -Raw).Trim()
          if ($env:GITHUB_REF_NAME -cne "v$version") { throw 'Release tag and desktop version differ.' }
          if (!$env:CAMO_UPDATE_PUBLIC_KEY -or !$env:CAMO_PORTABLE_SIGNING_KEY) {
            throw 'Configure CAMO_UPDATE_PUBLIC_KEY and CAMO_PORTABLE_SIGNING_KEY before releasing.'
          }
          $key = Join-Path $env:RUNNER_TEMP 'camo-update-public.pem'
          [IO.File]::WriteAllText($key, $env:CAMO_UPDATE_PUBLIC_KEY)
          ./scripts/build-portable-release.ps1 -OutputDirectory dist/portable-release -CaptureDirectory $env:CAMO_CAPTURE_DIRECTORY -OcrDirectory $env:CAMO_OCR_DIRECTORY -UpdatePublicKeyFile $key
          'CAMO_CHECK_ROOT=dist/portable-release/app' >> $env:GITHUB_ENV
      - name: Check bundled capture and OCR runtimes
        run: |
          $runtime = Join-Path $env:CAMO_CHECK_ROOT 'Runtime'
          $languages = & "$runtime/Ocr/tesseract.exe" --tessdata-dir "$runtime/Ocr/tessdata" --list-langs
          if ($LASTEXITCODE -or $languages -notcontains 'eng') { throw 'Bundled OCR cannot load the English model.' }
          $devices = & "$runtime/Capture/ffmpeg.exe" -hide_banner -devices
          if ($LASTEXITCODE -or !($devices -match '\bdshow\b')) { throw 'Bundled FFmpeg lacks DirectShow support.' }
      - run: ./tests/native-bridge.ps1 -Executable (Join-Path $env:CAMO_CHECK_ROOT 'Runtime/Bridge/CamoConnector.Bridge.exe')
      - name: Check the standard bridge with installed .NET
        if: github.ref_type == 'tag'
        run: |
          $dotnet = (Get-Command dotnet -CommandType Application | Select-Object -First 1).Source
          $env:DOTNET_ROOT_X64 = Split-Path -Parent $dotnet
          $runtimes = & $dotnet --list-runtimes
          $runtimes | Write-Output
          foreach ($framework in 'Microsoft.NETCore.App', 'Microsoft.WindowsDesktop.App', 'Microsoft.AspNetCore.App') {
            if (-not ($runtimes -match ('^' + [regex]::Escape($framework) + ' 10\.0\.'))) {
              throw "$framework 10.0 is missing from the x64 .NET installation at $env:DOTNET_ROOT_X64."
            }
          }
          $env:DOTNET_DISABLE_GUI_ERRORS = '1'
          ./tests/native-bridge.ps1 -Executable dist/portable-release/slim/Runtime/Bridge/CamoConnector.Bridge.exe
      - uses: actions/upload-artifact@v4
        if: github.ref_type != 'tag'
        with:
          name: CamoConnector-detector-development-win-x64
          path: dist/detector-development/
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: github.ref_type != 'tag'
        with:
          name: CamoConnector-desktop-preview-win-x64
          path: dist/desktop-preview/
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: github.ref_type == 'tag'
        with:
          name: CamoConnector-desktop-release
          path: |
            dist/portable-release/CamoConnector-v*-win-x64*.zip
            dist/portable-release/portable-*.json
            dist/portable-release/portable-*.sig
            dist/portable-release/runtime-*.json
            dist/portable-release/runtime-*.sig
          if-no-files-found: error

  publish:
    if: github.ref_type == 'tag'
    needs: build
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: CamoConnector-desktop-release
          path: release
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          $prefix = "CamoConnector-$env:GITHUB_REF_NAME-win-x64"
          $assets = @(
            "release/$prefix-slim.zip", "release/$prefix.zip", "release/$prefix-ocr.zip", "release/$prefix-capture.zip",
            'release/portable-update.json', 'release/portable-update.sig',
            'release/portable-slim-update.json', 'release/portable-slim-update.sig',
            'release/runtime-ocr.json', 'release/runtime-ocr.sig', 'release/runtime-capture.json', 'release/runtime-capture.sig'
          )
          foreach ($asset in $assets) { if (!(Test-Path -LiteralPath $asset)) { throw "Missing $asset" } }
          @"
          **Standard download:** [$prefix-slim.zip](https://github.com/$env:GH_REPO/releases/download/$env:GITHUB_REF_NAME/$prefix-slim.zip). Includes FFmpeg and OCR. Requires the installed x64 .NET 10 Desktop Runtime and ASP.NET Core Runtime.

          **Offline download:** [$prefix.zip](https://github.com/$env:GH_REPO/releases/download/$env:GITHUB_REF_NAME/$prefix.zip). Includes the .NET runtimes, OCR and capture support. Both editions use Microsoft Edge WebView2 for the built-in tracker.
          "@ | Set-Content release-notes.md
          gh release create $env:GITHUB_REF_NAME @assets --verify-tag --latest --generate-notes --notes-file release-notes.md --title "Camo Connector $env:GITHUB_REF_NAME"
          if ($LASTEXITCODE) { throw 'GitHub Release publishing failed.' }
      - name: Notify running clients
        env:
          CAMO_UPDATE_NOTIFY_URL: ${{ vars.CAMO_UPDATE_NOTIFY_URL }}
          CAMO_UPDATE_NOTIFY_TOKEN: ${{ secrets.CAMO_UPDATE_NOTIFY_TOKEN }}
        run: |
          if (!$env:CAMO_UPDATE_NOTIFY_URL) { return }
          if (!$env:CAMO_UPDATE_NOTIFY_TOKEN) { throw 'Configure CAMO_UPDATE_NOTIFY_TOKEN before publishing notifications.' }
          $uri = $env:CAMO_UPDATE_NOTIFY_URL.TrimEnd('/') + '/release'
          $headers = @{
            Authorization = "Bearer $env:CAMO_UPDATE_NOTIFY_TOKEN"
            'X-Camo-Version' = $env:GITHUB_REF_NAME.Substring(1)
          }
          Invoke-RestMethod -Uri $uri -Method Post -Headers $headers -TimeoutSec 15 -MaximumRetryCount 2
